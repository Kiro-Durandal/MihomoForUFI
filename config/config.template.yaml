# F50 Mihomo Beta 2.6-RC2.2.1 公共安装模板
# 后端可先安装，随后由设备管理窗口替换主订阅占位符并启用 Mihomo。
# 请勿把安装后生成的 config.yaml 上传到公开仓库。
# external-controller 对局域网开放，初始密钥按发布要求设为 123456；安装后建议尽快改成长随机值。

# 基础运行参数：规则模式、双栈解析、允许局域网设备使用。
mode: rule
log-level: info
ipv6: true
find-process-mode: 'off'
unified-delay: true
tcp-concurrent: true
allow-lan: true
bind-address: '*'

# MetaCubeXD / REST API：监听全部接口，端口固定为 9099。
# 123456 只是首次安装默认值，不应长期保留在不可信局域网。
external-controller: 0.0.0.0:9099
external-ui: /data/f50-mihomo/ui
external-ui-url: "https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"
secret: '123456'
external-controller-cors:
  allow-origins:
  - '*'
  allow-private-network: true

# 状态持久化：保存策略组选择与 Fake-IP 映射。
profile:
  store-selected: true
  store-fake-ip: true

# 监听器：7894 为 IPv4/IPv6 TProxy；7892 仅供设备本机显式代理。
listeners:
  - name: f50-tproxy
    type: tproxy
    listen: '::'
    port: 7894
    udp: true

  - name: f50-local
    type: mixed
    listen: 127.0.0.1
    port: 7892
    udp: true

# DNS：沿用参考配置的 Fake-IP 双栈方案及国内/境外解析策略。
dns:
  enable: true
  listen: ':1053'
  ipv6: true
  cache-algorithm: arc
  prefer-h3: false
  respect-rules: false
  # IPv4 与 IPv6 均使用 Fake-IP；对应地址池须与防火墙脚本保持一致。
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fdfe:dcba:9876::1/64
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
  - '+.lan'
  - '+.local'
  - '+.localdomain'
  - '+.msftncsi.com'
  - '+.msftconnecttest.com'
  - 'localhost.ptlogin2.qq.com'
  - 'stun.*.*'
  - 'stun.*.*.*'
  - 'stun.*.*.*.*'
  - '*.n.n.srv.nintendo.net'
  - '+.stun.playstation.net'
  - 'xbox.*.microsoft.com'
  - '+.xboxlive.com'
  - '+.battlenet.com.cn'
  - '+.wotgame.cn'
  - '+.wggames.cn'
  - '+.wowsgame.cn'
  - '+.wargaming.net'
  # 指定域名解析策略：连通性检测走国内 DNS，GFW 域名经香港策略组解析。
  nameserver-policy:
    '+.msftncsi.com':
      - 223.6.6.6
      - 119.29.29.29
    '+.msftconnecttest.com':
      - 223.6.6.6
      - 119.29.29.29
    'geosite:gfw':
      - 'https://cloudflare-dns.com/dns-query#HK - 自动选择'
      - 'https://dns10.quad9.net/dns-query#HK - 自动选择'
  # 基础解析器用于引导 DoH 域名解析；代理节点和直连域名使用域名 DoH。
  default-nameserver:
  - 223.6.6.6
  - 119.29.29.29
  nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  direct-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  direct-nameserver-follow-policy: false
  # 境外回退解析器及污染过滤条件。
  fallback:
  - 'https://cloudflare-dns.com/dns-query#HK - 自动选择'
  - 'https://dns10.quad9.net/dns-query#HK - 自动选择'
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32
      - 127.0.0.0/8
      - 100.64.0.0/10
  # 设备性能吃紧时可启用；未命中规则的境外域名首次解析可能稍慢。
  # fallback-lazy-query: true


# 订阅提供器：首次填写时写入 URL；后续更新经“代理模式”当前选中项发起。
# 首次拉取尚无节点缓存时请让“代理模式”保持 DIRECT，以完成引导。
proxy-providers:
  main:
    type: http
    url: __SUBSCRIPTION_URL__
    path: ./providers/main.yaml
    interval: 21600
    proxy: 代理模式
    size-limit: 10485760
    header:
      User-Agent:
      - FlClash/v0.8.93 clash-verge Platform/android
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 600
      timeout: 5000
      lazy: true

